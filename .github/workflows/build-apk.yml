
name: Build San Martino APK

on:
  workflow_dispatch:
  push:
    branches:
      - beta-1.3
    paths:
      - 'night-shift-assistant/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: night-shift-assistant

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: night-shift-assistant/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install dependencies
        run: npm ci

      - name: Install TypeScript
        run: npm install --no-save typescript@5.9.3

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: san-martino-beta-1.3-apk
          path: night-shift-assistant/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
